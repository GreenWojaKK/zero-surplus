[package]
name = "zero-surplus"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/GreenWojaKK/zero-surplus"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive", "env"] }
dua-core = "=6.1.0"
forensic-rs = "0.13"
frnsc-prefetch = "0.13.4"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.1"
winparsingtools = "2.1.4"
windows-sys = { version = "0.61.1", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Jet",
    "Win32_Storage_StructuredStorage",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Keep target/ small: no debug info, no incremental cache.
[profile.dev]
debug = false
incremental = false

[profile.release]
debug = false
incremental = false
strip = true
